# Main Flask web service (default).
# For the WhatsApp bot: add a SECOND service in Railway dashboard,
# point it to this same repo, and set:
#   Start Command:  node whatsapp_bot.js
#   Build Command:  npm install
#   Environment:    ANTHROPIC_API_KEY, JARVIS_WA_ENABLED=true
# Mount a persistent volume at /app/.wwebjs_auth to keep the WA session.

[build]
builder = "nixpacks"

[deploy]
startCommand = "gunicorn main:app"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
